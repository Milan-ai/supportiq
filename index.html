<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportIQ · NDIS operations</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18221f;background:#f5f7f5}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #80c9a4;outline-offset:2px}.shell{display:flex;min-height:100vh}aside{width:252px;flex:none;background:#fff;border-right:1px solid #e5ebe6;padding:28px 16px;position:sticky;top:0;height:100vh}.logo{font-size:25px;font-weight:850;letter-spacing:-1.4px;margin:4px 13px 35px}.logo span{color:#23815c}.eyebrow{font-size:10px;letter-spacing:1.6px;font-weight:800;color:#829088;text-transform:uppercase}nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:13px;border-radius:12px;color:#66746c;font-size:13px;font-weight:650;margin:3px 0}nav button.active{background:#e8f4ec;color:#216b49}nav button:hover{background:#f2f6f2}.sidebottom{position:absolute;bottom:24px;left:27px;right:20px;font-size:11px;color:#87958b;line-height:1.7}main{width:100%;max-width:1500px;margin:auto;padding:35px 44px 70px;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:38px}.top small{color:#88938b}.avatar{background:#dbece0;border-radius:100%;width:38px;height:38px;display:grid;place-items:center;color:#246b49;font-weight:800}.pagehead h1{font-size:clamp(30px,4vw,50px);letter-spacing:-2px;margin:8px 0 9px;line-height:1.12}.pagehead p{font-size:14px;color:#7a877e;line-height:1.7;margin:0 0 25px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}.metric,.card{background:#fff;border:1px solid #e8ede8;border-radius:19px;padding:22px}.metric b{display:block;font-size:34px;letter-spacing:-1.5px;margin:11px 0 4px}.metric small{font-size:11px;color:#839086}.metric .foot{font-size:11px;color:#4a8969;margin-top:10px}.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:17px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card h2{font-size:20px;letter-spacing:-.6px;margin:4px 0 6px}.card h3{font-size:15px;margin:8px 0}.muted{color:#859087;font-size:12px;line-height:1.6}.section{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:29px 0 13px}.section h2{font-size:21px;letter-spacing:-.7px;margin:0}.pill{display:inline-block;border-radius:99px;padding:6px 10px;font-size:10px;font-weight:800;background:#eef3ee;color:#607568}.pill.red{background:#fff0e9;color:#b8663b}.pill.amber{background:#fff5df;color:#9b741d}.pill.green{background:#e8f6ec;color:#27835a}.btn{background:#247a55;color:white;border:0;border-radius:99px;padding:11px 17px;font-size:12px;font-weight:750}.btn:hover{background:#17633f}.btn.secondary{background:#edf4ee;color:#246b49}.btn.light{background:#f2f5f2;color:#465e4d}.btn:disabled{opacity:.4;cursor:not-allowed}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.line{border-bottom:1px solid #edf0ed;padding:15px 0;display:flex;align-items:center;justify-content:space-between;gap:15px}.line:last-child{border:0}.line b{font-size:13px}.line p{margin:5px 0 0;color:#839086;font-size:11px}.tablewrap{overflow:auto}.tbl{border-collapse:collapse;width:100%;min-width:730px}.tbl th{text-align:left;color:#8b968e;font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:13px 10px;border-bottom:1px solid #edf0ed}.tbl td{padding:14px 10px;font-size:12px;border-bottom:1px solid #f0f2f0}.tbl tr:last-child td{border:0}.tbl td small{display:block;color:#8a968e;margin-top:4px}.tbl input[type=checkbox]{accent-color:#258257;width:16px;height:16px}.field{display:block;font-size:11px;font-weight:750;color:#617369;margin:15px 0 6px}.control{background:#fff;border:1px solid #dfe8df;border-radius:11px;padding:11px 12px;color:#33453a;max-width:100%;width:100%}textarea.control{min-height:140px;line-height:1.6;resize:vertical}.notice{background:#f0f7f1;border:1px solid #dcebdd;border-radius:13px;padding:15px;color:#477259;font-size:12px;line-height:1.6;margin:14px 0}.warning{background:#fff7ea;border-color:#f0e0bf;color:#846329}.progress{height:9px;background:#e9efe9;border-radius:50px;overflow:hidden;margin:9px 0}.progress i{height:100%;background:#31895e;display:block}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.bar{height:10px;background:#edf0ed;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#56a97d}.flow{display:flex;align-items:center;gap:12px;margin:13px 0}.flow b{font-size:12px;min-width:110px}.flow small{color:#78877b;font-size:11px;min-width:35px;text-align:right}.toast{position:fixed;bottom:25px;right:25px;background:#1b392a;color:#fff;padding:13px 18px;border-radius:13px;box-shadow:0 12px 40px #0002;z-index:10;font-size:12px}.empty{text-align:center;padding:35px;color:#89958d}.mobnav{display:none}.sr{position:absolute;left:-9999px}@media(max-width:1050px){aside{width:205px}main{padding:28px}.metrics{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}}@media(max-width:750px){aside{display:none}.mobnav{display:flex;gap:5px;overflow:auto;position:sticky;top:0;z-index:4;background:#fff;padding:10px;border-bottom:1px solid #e6ebe6}.mobnav button{white-space:nowrap;border:0;border-radius:99px;background:#f0f4f0;padding:10px 13px;font-size:11px}.mobnav button.active{background:#246e4c;color:white}main{padding:22px 16px 65px}.grid,.cols,.grid3{grid-template-columns:1fr}.metric{padding:16px}.metric b{font-size:27px}.card{padding:18px}.top{margin-bottom:24px}}
</style></head><body><div class="mobnav" id="mobile"></div><div class="shell"><aside><div class="logo">support<span>IQ</span><div class="eyebrow" style="margin-top:7px">Provider intelligence</div></div><nav id="nav"></nav><div class="sidebottom">● Interactive local demo<br>Fictional participants · No external sends<br>Data saved in this browser only</div></aside><main><div class="top"><div><div class="eyebrow">SUPPORTIQ / OPERATIONS</div><small>NDIS provider command centre</small></div><div class="avatar">SI</div></div><div id="content"></div></main></div><div id="toast" hidden class="toast"></div><script>
const menu=[['overview','◫','Overview'],['participants','♙','Participants'],['funding','◈','Funding intelligence'],['compliance','✓','Compliance & incidents'],['workforce','♧','Workforce readiness'],['claims','▤','Claims assurance'],['communications','✉','Communications'],['actions','↗','Action centre'],['reports','▥','Impact reports'],['settings','⚙','Data & settings']];
const defaults=[
{id:'P1001',name:'Alex Morgan',plan:18000,spent:15120,committed:4100,days:90,manager:'Sarah',status:'Active',contact:'alex@example.test',consent:true},
{id:'P1002',name:'Taylor Chen',plan:26000,spent:9000,committed:4800,days:190,manager:'Sarah',status:'Active',contact:'taylor@example.test',consent:true},
{id:'P1003',name:'Jordan Lee',plan:14500,spent:12400,committed:3200,days:55,manager:'Priya',status:'Active',contact:'jordan@example.test',consent:false},
{id:'P1004',name:'Casey Patel',plan:32000,spent:16000,committed:12500,days:120,manager:'Priya',status:'Active',contact:'casey@example.test',consent:true},
{id:'P1005',name:'Sam Wilson',plan:21000,spent:17500,committed:2200,days:32,manager:'Sarah',status:'Active',contact:'sam@example.test',consent:true},
{id:'P1006',name:'Riley Brown',plan:12500,spent:4900,committed:1800,days:180,manager:'Amir',status:'Active',contact:'riley@example.test',consent:true},
{id:'P1007',name:'Jamie Singh',plan:22000,spent:17600,committed:6000,days:68,manager:'Amir',status:'Active',contact:'jamie@example.test',consent:true},
{id:'P1008',name:'Morgan Davis',plan:19000,spent:6000,committed:3000,days:210,manager:'Sarah',status:'Active',contact:'morgan@example.test',consent:true}];
const defaultIssues=[
{id:'I01',type:'Support note',subject:'Alex Morgan',detail:'Two service notes awaiting completion',owner:'Sarah',due:'Today',status:'Open',severity:'Medium'},
{id:'I02',type:'Incident',subject:'Jordan Lee',detail:'Incident follow-up review required',owner:'Priya',due:'Today',status:'Open',severity:'High'},
{id:'I03',type:'Complaint',subject:'Taylor Chen',detail:'Family feedback requires response',owner:'Sarah',due:'Tomorrow',status:'Open',severity:'Medium'},
{id:'I04',type:'Credential',subject:'Worker SW-018',detail:'Worker screening status requires verification',owner:'Amir',due:'Today',status:'Open',severity:'High'},
{id:'I05',type:'Claim',subject:'Claim CL-2004',detail:'Potential duplicate service entry',owner:'Priya',due:'Tomorrow',status:'Open',severity:'Medium'},
{id:'I06',type:'Agreement',subject:'Sam Wilson',detail:'Service agreement review due',owner:'Sarah',due:'This week',status:'Open',severity:'Low'},
{id:'I07',type:'Shift',subject:'Worker SW-022',detail:'Training evidence not confirmed',owner:'Amir',due:'This week',status:'Open',severity:'Medium'}];
const defaultClaims=[
{id:'CL-2001',participant:'Alex Morgan',date:'2026-10-15',code:'01_011_0107_1_1',amount:130,status:'Ready',reason:'—'},
{id:'CL-2002',participant:'Taylor Chen',date:'2026-10-15',code:'01_011_0107_1_1',amount:130,status:'Ready',reason:'—'},
{id:'CL-2003',participant:'Jordan Lee',date:'2026-10-16',code:'01_011_0107_1_1',amount:260,status:'Review',reason:'Missing service note'},
{id:'CL-2004',participant:'Alex Morgan',date:'2026-10-15',code:'01_011_0107_1_1',amount:130,status:'Review',reason:'Potential duplicate'},
{id:'CL-2005',participant:'Sam Wilson',date:'2026-10-17',code:'01_011_0107_1_1',amount:195,status:'Ready',reason:'—'}];
let state;try{state=JSON.parse(localStorage.getItem('supportiq-v1'))}catch(e){}if(!state||!Array.isArray(state.participants))state={participants:structuredClone(defaults),issues:structuredClone(defaultIssues),claims:structuredClone(defaultClaims),tasks:[],campaigns:[],events:[],next:1};let page='overview',focus=null,flow=null,selected=[],scenario=0,filter='All';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD',maximumFractionDigits:0}).format(n),save=()=>{try{localStorage.setItem('supportiq-v1',JSON.stringify(state))}catch(e){}};function log(t,detail){state.events.unshift({at:new Date().toLocaleString('en-AU'),type:t,detail});save()}function notify(t){let e=$('toast');e.textContent=t;e.hidden=false;setTimeout(()=>e.hidden=true,3300)}
function forecast(p,rate=0){let total=p.spent+p.committed+rate*p.days/30,remaining=p.plan-total,pct=total/p.plan*100;return {total,remaining,pct,status:remaining<0?'Critical':pct>90?'Watch':'On track'}}function badge(s){return '<span class="pill '+(/Critical|High|Open|Review|Overdue/.test(s)?'red':/Watch|Medium|Pending|Draft/.test(s)?'amber':'green')+'">'+esc(s)+'</span>'}
function head(k,t,sub){return '<div class="pagehead"><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+sub+'</p></div>'}function metric(label,value,foot=''){return '<div class="metric"><small>'+label+'</small><b>'+value+'</b><div class="foot">'+foot+'</div></div>'}function section(t,sub=''){return '<div class="section"><h2>'+t+'</h2><span class="muted">'+sub+'</span></div>'}function button(label,act,style=''){return '<button class="btn '+style+'" onclick="'+act+'">'+label+'</button>'}
function setPage(p){page=p;focus=null;flow=null;selected=[];render();window.scrollTo(0,0)}
function render(){let nav=menu.map(([id,ic,label])=>'<button class="'+(page===id?'active':'')+'" onclick="setPage(\''+id+'\')"><span>'+ic+'</span>'+label+'</button>').join('');$('nav').innerHTML=nav;$('mobile').innerHTML=menu.map(([id,ic,label])=>'<button class="'+(page===id?'active':'')+'" onclick="setPage(\''+id+'\')">'+label+'</button>').join('');$('content').innerHTML=({overview,participants,funding,compliance,workforce,claims,communications,actions,reports,settings})[page]()}
function alertRows(){return state.participants.map(p=>({...p,...forecast(p)})).filter(p=>p.status==='Critical'||p.status==='Watch').sort((a,b)=>a.remaining-b.remaining)}
function overview(){let alerts=alertRows(),open=state.issues.filter(x=>x.status!=='Resolved'),unready=state.claims.filter(x=>x.status==='Review');return head('YOUR DAY, SIMPLIFIED','Good morning. Here’s what matters.','See the issues, understand the next step and take action from one calm workspace.')+'<div class="metrics">'+metric('Funding alerts',alerts.length,'Forecast-based · review required')+metric('Open follow-ups',open.length,'Across compliance and workforce')+metric('Claims needing review',unready.length,'Check before submission')+metric('Actions completed',state.tasks.filter(x=>x.status==='Completed').length,'Recorded in this browser')+'</div>'+section('Your priority list','Recommended next steps')+'<div class="grid"><div class="card">'+alerts.slice(0,4).map(p=>'<div class="line"><div><b>'+esc(p.name)+'</b> '+badge(p.status)+'<p>'+money(p.remaining)+' projected balance after commitments</p></div>'+button('Review plan →','openParticipant(\''+p.id+'\')')+'</div>').join('')+(alerts.length>4?button('View all alerts →','setPage(\'funding\')','secondary'):'')+'</div><div class="card"><h2>Resolve outstanding work</h2>'+open.slice(0,4).map(i=>'<div class="line"><div><b>'+esc(i.type)+'</b><p>'+esc(i.detail)+'</p></div>'+button('Resolve →','openIssue(\''+i.id+'\')','secondary')+'</div>').join('')+'</div></div>'+section('Operational pulse')+'<div class="grid3"><div class="card"><h3>Funding continuity</h3><p class="muted">Review projected overspends before scheduled supports are disrupted.</p>'+button('Open funding intelligence →','setPage(\'funding\')','secondary')+'</div><div class="card"><h3>Evidence readiness</h3><p class="muted">Assign documentation, incident and credential follow-ups.</p>'+button('Open compliance →','setPage(\'compliance\')','secondary')+'</div><div class="card"><h3>Communication workflow</h3><p class="muted">Prepare approved messages and record outreach without losing the audit trail.</p>'+button('Open communications →','setPage(\'communications\')','secondary')+'</div></div>'+demoNote()}
function demoNote(){return '<div class="notice warning"><b>Demonstration environment.</b> All initial participant and worker records are fictional. Messages are drafts only, claims are not submitted, and no NDIS, provider, payroll or messaging system is connected. Do not import real personal or health information into this local demo.</div>'}
function participantTable(rows){return '<div class="tablewrap"><table class="tbl"><thead><tr><th>Participant</th><th>Plan budget</th><th>Spent + committed</th><th>Forecast balance</th><th>Risk</th><th>Action</th></tr></thead><tbody>'+rows.map(p=>{let f=forecast(p,scenario);return '<tr><td><b>'+esc(p.name)+'</b><small>'+esc(p.id)+' · '+esc(p.manager)+'</small></td><td>'+money(p.plan)+'</td><td>'+money(f.total)+'</td><td>'+money(f.remaining)+'</td><td>'+badge(f.status)+'</td><td>'+button('Open plan →','openParticipant(\''+p.id+'\')','secondary')+'</td></tr>'}).join('')+'</tbody></table></div>'}
function participants(){if(focus)return participantDetail();return head('PEOPLE FIRST','Participants','Every funding signal, service record and follow-up in one place.')+'<div class="card">'+participantTable(state.participants)+'</div>'+section('Add a sample participant')+'<div class="card"><div class="cols"><div><label class="field">Name</label><input id="newname" class="control" placeholder="Sample participant name"><label class="field">Plan budget (AUD)</label><input id="newplan" type="number" class="control" value="18000"></div><div><label class="field">Spent (AUD)</label><input id="newspent" type="number" class="control" value="7000"><label class="field">Committed (AUD)</label><input id="newcommitted" type="number" class="control" value="5000"></div></div><div class="actions" style="margin-top:16px">'+button('Add fictional participant','addParticipant()')+'</div></div>'}
function addParticipant(){let name=$('newname').value.trim(),plan=+$('newplan').value,spent=+$('newspent').value,committed=+$('newcommitted').value;if(!name||plan<=0||spent<0||committed<0){notify('Enter a name and valid amounts');return}let id='P'+(1100+state.next++);state.participants.push({id,name,plan,spent,committed,days:90,manager:'Unassigned',status:'Active',contact:'',consent:false});log('Participant added',id+' · '+name);render();notify('Sample participant added')}
function openParticipant(id){page='participants';focus=id;render();window.scrollTo(0,0)}
function participantDetail(){let p=state.participants.find(x=>x.id===focus);if(!p){focus=null;return participants()}let f=forecast(p,scenario),used=Math.min(100,Math.max(0,f.pct));return '<div class="actions">'+button('← All participants','focus=null;render()','light')+'</div>'+head('PARTICIPANT / '+esc(p.id),esc(p.name),'Plan oversight, forecast assumptions and recommended follow-up.')+'<div class="metrics">'+metric('Approved budget',money(p.plan))+metric('Spent to date',money(p.spent))+metric('Scheduled commitments',money(p.committed))+metric('Projected balance',money(f.remaining),f.status)+'</div><div class="grid"><div class="card"><h2>Funding forecast</h2><p class="muted">Spent + committed against current plan allocation.</p><div class="progress"><i style="width:'+used+'%"></i></div><p class="muted">'+Math.round(f.pct)+'% forecast utilisation · '+p.days+' days remaining</p><div class="notice '+(f.remaining<0?'warning':'')+'">'+(f.remaining<0?'Forecast exceeds available budget by '+money(-f.remaining)+'. Review support scheduling and funding records with the authorised team.':'Forecast within current budget based on entered figures. Continue monitoring.')+'</div>'+button('Create funding review task →','createTask(\'Funding review\',\''+p.id+'\',\'Validate plan balances and upcoming commitments\')')+'</div><div class="card"><h2>Communication and next steps</h2><p class="muted">Responsible team member: '+esc(p.manager)+'</p><p class="muted">Contact permission: '+(p.consent?'Fictional consent flag enabled':'No fictional consent flag')+'</p>'+button('Prepare an authorised update →','startMessage(\''+p.id+'\')','secondary')+'<div class="notice warning">Never send plan or sensitive support details to an unverified contact. Real consent and identity checks are not implemented.</div></div></div>'}
function funding(){let alerts=alertRows();let moves=state.participants.map(p=>{let b=forecast(p),a=forecast(p,scenario);return {p,from:b.status,to:a.status}}).filter(x=>x.from!==x.to);return head('PLAN OVERSIGHT','Funding intelligence','See forecast risks, test assumptions and create accountable follow-ups.')+'<div class="card"><div class="cols"><div><h2>Scenario modeller</h2><p class="muted">Additional monthly planned support cost across remaining plan days. Illustrative calculation, not an NDIS funding determination.</p><label class="field" for="scenario">Change in monthly scheduled support cost</label><input style="width:100%;accent-color:#248257" id="scenario" type="range" min="-1500" max="1500" step="100" value="'+scenario+'" oninput="scenario=+this.value;render()"></div><div class="metric" style="background:#f4f8f4"><small>Scenario change</small><b>'+(scenario>=0?'+':'')+money(scenario)+'</b><small>per month · hypothetical</small></div></div></div><div class="metrics">'+metric('Critical after scenario',state.participants.filter(p=>forecast(p,scenario).status==='Critical').length)+metric('Watch after scenario',state.participants.filter(p=>forecast(p,scenario).status==='Watch').length)+metric('Moved risk status',moves.length,'Compared with baseline')+metric('Baseline alerts',alerts.length)+'</div>'+section('Status migration','Before → after')+'<div class="card">'+(moves.length?moves.map(x=>'<div class="line"><div><b>'+esc(x.p.name)+'</b><p>'+x.from+' → '+x.to+'</p></div>'+button('Review →','openParticipant(\''+x.p.id+'\')','secondary')+'</div>').join(''):'<div class="empty">No participants cross a status threshold under this scenario.</div>')+'</div>'+section('All participant forecasts')+'<div class="card">'+participantTable(state.participants)+'</div>'}
function issuePage(type){let rows=state.issues.filter(x=>type==='all'||(type==='workforce'?['Credential','Shift'].includes(x.type):!['Credential','Shift'].includes(x.type)));return '<div class="card">'+rows.map(i=>'<div class="line"><div><b>'+esc(i.type)+' · '+esc(i.subject)+'</b> '+badge(i.severity)+' '+badge(i.status)+'<p>'+esc(i.detail)+' · '+esc(i.owner)+' · '+esc(i.due)+'</p></div>'+button('Open action →','openIssue(\''+i.id+'\')','secondary')+'</div>').join('')+'</div>'}
function compliance(){if(focus)return issueDetail();return head('AUDIT-READY OPERATIONS','Compliance & incidents','A traceable queue for documentation, complaints, incidents and agreements.')+issuePage('compliance')+section('Create follow-up')+newIssueForm()}
function workforce(){if(focus)return issueDetail();return head('SUPPORT WORKER OPERATIONS','Workforce readiness','Track screening verification, training evidence and shift readiness. Never treat a demo flag as verified clearance.')+issuePage('workforce')+section('Create workforce task')+newIssueForm()}
function newIssueForm(){return '<div class="card"><div class="cols"><div><label class="field">Issue type</label><select id="issue-type" class="control"><option>Support note</option><option>Incident</option><option>Complaint</option><option>Credential</option><option>Shift</option><option>Agreement</option></select><label class="field">Subject</label><input id="issue-subject" class="control" placeholder="Sample participant or worker"></div><div><label class="field">Owner</label><input id="issue-owner" class="control" value="Unassigned"><label class="field">Required action</label><input id="issue-detail" class="control" placeholder="Describe what needs to happen"></div></div><div style="margin-top:15px">'+button('Create follow-up →','addIssue()')+'</div></div>'}
function addIssue(){let subject=$('issue-subject').value.trim(),detail=$('issue-detail').value.trim();if(!subject||!detail){notify('Add a subject and action');return}let id='I'+String(100+state.next++);state.issues.unshift({id,type:$('issue-type').value,subject,detail,owner:$('issue-owner').value||'Unassigned',due:'This week',status:'Open',severity:'Medium'});log('Issue created',id+' · '+detail);render();notify('Follow-up created')}
function openIssue(id){focus=id;page=state.issues.find(x=>x.id===id)?.type==='Credential'||state.issues.find(x=>x.id===id)?.type==='Shift'?'workforce':'compliance';render();window.scrollTo(0,0)}
function issueDetail(){let i=state.issues.find(x=>x.id===focus);if(!i)return issuePage('all');return '<div class="actions">'+button('← Back to queue','focus=null;render()','light')+'</div>'+head('ACTION / '+i.id,esc(i.type)+' follow-up',esc(i.subject))+'<div class="card"><h2>'+esc(i.detail)+'</h2><p>Current status: '+badge(i.status)+'</p><label class="field">Assigned owner</label><input class="control" id="owner" value="'+esc(i.owner)+'"><label class="field">Resolution notes / evidence reference</label><textarea id="resolution" class="control" placeholder="Describe action taken. Do not enter sensitive details in this demo."></textarea><div class="actions" style="margin-top:16px">'+button('Assign and save →','saveIssue(false)')+button('Mark resolved →','saveIssue(true)','secondary')+'</div></div>'}
function saveIssue(done){let i=state.issues.find(x=>x.id===focus),note=$('resolution').value.trim();if(done&&!note){notify('Add a resolution note first');return}i.owner=$('owner').value.trim()||'Unassigned';i.status=done?'Resolved':'In progress';log(done?'Issue resolved':'Issue assigned',i.id+' · '+i.owner+(note?' · '+note:''));focus=null;render();notify(done?'Resolution recorded':'Owner updated')}
function claims(){return head('REVENUE ASSURANCE','Claims assurance','Identify documentation gaps and potential duplicates before export. No claim is submitted to the NDIA.')+'<div class="metrics">'+metric('Claim records',state.claims.length)+metric('Review required',state.claims.filter(x=>x.status==='Review').length)+metric('Ready to export',state.claims.filter(x=>x.status==='Ready').length)+metric('Sample claim value',money(state.claims.reduce((s,x)=>s+x.amount,0)))+'</div><div class="card"><div class="tablewrap"><table class="tbl"><thead><tr><th>Claim</th><th>Participant</th><th>Service date</th><th>Amount</th><th>Review reason</th><th>Status</th><th>Action</th></tr></thead><tbody>'+state.claims.map(c=>'<tr><td>'+c.id+'</td><td>'+esc(c.participant)+'</td><td>'+c.date+'</td><td>'+money(c.amount)+'</td><td>'+esc(c.reason)+'</td><td>'+badge(c.status)+'</td><td>'+button(c.status==='Review'?'Review →':'Export row →','claimAction(\''+c.id+'\')','secondary')+'</td></tr>').join('')+'</tbody></table></div></div><div class="notice warning">Claim validation is illustrative and does not check current NDIS pricing arrangements, service agreements, actual delivery, or payment eligibility.</div>'}
function claimAction(id){let c=state.claims.find(x=>x.id===id);if(c.status==='Review'){createTask('Claim verification',id,'Validate service record and potential duplicate before submission');return}download('supportiq-claim-'+id+'.csv','id,participant,date,code,amount,status\n'+[c.id,c.participant,c.date,c.code,c.amount,c.status].map(csv).join(',')+'\n');log('Claim row exported',id)}
function createTask(type,subject,detail){let id='T'+String(state.next++).padStart(4,'0');state.tasks.unshift({id,type,subject,detail,owner:'Unassigned',status:'Open',created:new Date().toLocaleDateString('en-AU')});log('Task created',id+' · '+type+' · '+subject);page='actions';focus=null;render();notify('Action assigned to queue')}
function actions(){let open=state.tasks.filter(x=>x.status!=='Completed');return head('FROM INSIGHT TO ACTION','Action centre','Every recommendation should have an owner, an action and a recorded outcome.')+'<div class="metrics">'+metric('Open tasks',open.length)+metric('Completed tasks',state.tasks.length-open.length)+metric('Issues resolved',state.issues.filter(x=>x.status==='Resolved').length)+metric('Communications prepared',state.campaigns.length)+'</div><div class="card">'+(state.tasks.length?state.tasks.map(t=>'<div class="line"><div><b>'+esc(t.type)+' · '+esc(t.subject)+'</b> '+badge(t.status)+'<p>'+esc(t.detail)+' · Owner: '+esc(t.owner)+'</p></div><div class="actions">'+(t.status!=='Completed'?button('Complete →','completeTask(\''+t.id+'\')','secondary'):'')+'</div></div>').join(''):'<div class="empty">No tasks yet. Open a funding alert, issue or claim to create one.</div>')+'</div>'+section('Recent activity')+'<div class="card">'+(state.events.length?state.events.slice(0,15).map(e=>'<div class="line"><div><b>'+esc(e.type)+'</b><p>'+esc(e.detail)+'</p></div><small class="muted">'+esc(e.at)+'</small></div>').join(''):'<div class="empty">Activity will appear here as you work.</div>')+'</div>'}
function completeTask(id){let t=state.tasks.find(x=>x.id===id);let note=prompt('Resolution summary (required):');if(!note||!note.trim())return;t.status='Completed';log('Task completed',id+' · '+note.trim());render();notify('Task completed and recorded')}
function startMessage(id){page='communications';selected=[id];flow={step:0,channel:'Email',message:''};flow.message=messageTemplate();render();window.scrollTo(0,0)}
function messageTemplate(){return flow.channel==='SMS'?'Hi {{first_name}}, our team would like to arrange a time to discuss your support schedule. Please contact your usual coordinator if you would like to talk.':'Subject: Checking in about your supports\n\nHi {{first_name}},\n\nOur team would like to check whether your upcoming support schedule still meets your needs. Please contact your usual coordinator if you would like to arrange a conversation.\n\nKind regards,\nSupport Coordination Team'}
function chooseAll(on){selected=on?state.participants.map(p=>p.id):[];render()}function toggle(id,on){if(on&&!selected.includes(id))selected.push(id);if(!on)selected=selected.filter(x=>x!==id)}
function beginFlow(){if(!selected.length){notify('Select at least one participant');return}flow={step:0,channel:'Email',message:''};flow.message=messageTemplate();render()}
function flowChannel(c){flow.channel=c;flow.message=messageTemplate();render()}
function flowNext(){if(flow.step===1){let e=$('msg');if(e)flow.message=e.value;if(!flow.message.trim()){notify('Message cannot be blank');return}}flow.step++;render()}
function sendDraft(){let ok=$('approval');if(!ok?.checked){notify('Confirm this is a draft-only simulation');return}let recipients=state.participants.filter(p=>selected.includes(p.id)),allowed=recipients.filter(p=>p.consent),blocked=recipients.length-allowed.length,id='C'+String(state.next++).padStart(4,'0');state.campaigns.unshift({id,channel:flow.channel,selected:recipients.length,prepared:allowed.length,blocked,created:new Date().toLocaleString('en-AU'),status:'Draft prepared · not sent',message:flow.message,recipients:allowed.map(p=>p.id)});log('Communication draft prepared',id+' · '+allowed.length+' eligible · '+blocked+' blocked');flow.step=3;flow.id=id;save();render()}
function communications(){if(flow)return flowView();return head('CLEAR, CONSENT-LED UPDATES','Communications','Prepare personalised messages and call tasks for authorised staff review. Nothing is sent externally.')+'<div class="card"><h2>Select recipients</h2><p class="muted">Select fictional participants and create a reviewable communication draft.</p><div class="actions">'+button('Select all','chooseAll(true)','secondary')+button('Clear selection','chooseAll(false)','light')+button('Prepare outreach →','beginFlow()')+'</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Select</th><th>Participant</th><th>Coordinator</th><th>Fictional consent flag</th></tr></thead><tbody>'+state.participants.map(p=>'<tr><td><input type="checkbox" aria-label="Select '+esc(p.name)+'" '+(selected.includes(p.id)?'checked':'')+' onchange="toggle(\''+p.id+'\',this.checked)"></td><td>'+esc(p.name)+'</td><td>'+esc(p.manager)+'</td><td>'+badge(p.consent?'Demo yes':'No')+'</td></tr>').join('')+'</tbody></table></div></div>'+section('Prepared communications')+'<div class="card">'+(state.campaigns.length?state.campaigns.map(c=>'<div class="line"><div><b>'+c.id+' · '+c.channel+'</b><p>'+c.prepared+' eligible · '+c.blocked+' excluded · '+c.created+'</p></div>'+badge(c.status)+'</div>').join(''):'<div class="empty">No drafts prepared yet.</div>')+'</div>'}
function flowView(){let recipients=state.participants.filter(p=>selected.includes(p.id)),allowed=recipients.filter(p=>p.consent),blocked=recipients.length-allowed.length;let s=flow.step;let h=head('COMMUNICATION WORKFLOW / STEP '+(s+1),' '+['Choose a channel','Personalise the content','Review and approve','Draft created'][s],recipients.length+' selected · '+allowed.length+' eligible · '+blocked+' excluded');let body='';
if(s===0)body='<div class="metrics">'+metric('Selected',recipients.length)+metric('Eligible',allowed.length)+metric('Excluded',blocked)+metric('Real messages sent','0')+'</div><h3>Choose your channel</h3><div class="actions">'+['Email','SMS','Call','Push'].map(c=>button(c,'flowChannel(\''+c+'\')',flow.channel===c?'':'secondary')).join('')+'</div><div class="notice warning">Contact permission flags are fictional. In production, verify consent, authorised contacts, preferences, identity and opt-outs before communicating.</div>'+button('Continue →','flowNext()');
if(s===1)body='<label class="field">Editable '+flow.channel+' template</label><textarea class="control" id="msg">'+esc(flow.message)+'</textarea><h3>Personalised preview</h3><div class="card" style="background:#f7f9f7;white-space:pre-wrap;font-size:12px;line-height:1.7">'+esc(flow.message.replaceAll('{{first_name}}',allowed[0]?.name.split(' ')[0]||'Participant'))+'</div><div class="actions" style="margin-top:18px">'+button('← Back','flow.step--;render()','secondary')+button('Review →','flowNext()')+'</div>';
if(s===2)body='<div class="metrics">'+metric('Draft recipients',allowed.length)+metric('Excluded',blocked)+metric('Channel',flow.channel)+metric('Real sends','0')+'</div><div class="card" style="white-space:pre-wrap;font-size:12px;line-height:1.7">'+esc(flow.message)+'</div><div class="notice warning">This creates a draft record only. It will not send SMS, email, app notifications or calls. No verified contact permission is available.</div><label class="field"><input id="approval" type="checkbox"> I understand this is a draft-only demo.</label><div class="actions">'+button('← Edit','flow.step--;render()','secondary')+button('Create draft record →','sendDraft()')+'</div>';
if(s===3)body='<div class="notice"><b>Draft '+flow.id+' created.</b><br>Eligible recipients and excluded contacts have been recorded locally. No real message has been sent.</div><div class="actions">'+button('View communications','flow=null;selected=[];render()')+button('View action centre','setPage(\'actions\')','secondary')+'</div>';
return h+'<div class="card">'+body+'</div>'}
function reports(){let completed=state.tasks.filter(t=>t.status==='Completed').length,resolved=state.issues.filter(i=>i.status==='Resolved').length,prepared=state.campaigns.reduce((a,c)=>a+c.prepared,0),changes=state.participants.map(p=>({before:forecast(p).status,after:forecast(p,scenario).status})).filter(x=>x.before!==x.after);let statuses=['On track','Watch','Critical'];return head('MEASURE WHAT CHANGED','Impact reports','Operational activity and status migration, with clear distinctions between measured and illustrative metrics.')+'<div class="metrics">'+metric('Tasks completed',completed,'Recorded in this browser')+metric('Issues resolved',resolved,'Recorded in this browser')+metric('Message drafts prepared',prepared,'Not sent externally')+metric('Scenario status changes',changes.length,'Hypothetical only')+'</div>'+section('Risk-status migration','Current scenario')+'<div class="card"><div class="tablewrap"><table class="tbl"><thead><tr><th>Before ↓ / After →</th>'+statuses.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+statuses.map(a=>'<tr><td><b>'+a+'</b></td>'+statuses.map(b=>'<td>'+state.participants.filter(p=>forecast(p).status===a&&forecast(p,scenario).status===b).length+'</td>').join('')+'</tr>').join('')+'</tbody></table></div><p class="muted">Adjust the scenario slider in Funding intelligence to explore status movement. Counts are calculated from sample records and entered assumptions.</p></div>'+section('What we can verify')+'<div class="grid"><div class="card"><h2>Recorded actions</h2>'+[['Completed tasks',completed],['Resolved issues',resolved],['Communication drafts',state.campaigns.length]].map(x=>'<div class="line"><b>'+x[0]+'</b><b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><h2>Not yet measurable</h2><p class="muted">Actual staff hours saved, provider delivery rates, claim acceptance, participant outcomes and real compliance status require production integrations and baseline measurement.</p><div class="notice warning">No estimated savings are presented as achieved results.</div></div></div>'+section('Export')+'<div class="actions">'+button('Download action report CSV','exportTasks()')+button('Download activity CSV','exportEvents()','secondary')+'</div>'}
function csv(s){return '"'+String(s??'').replaceAll('"','""')+'"'}function download(name,data,type='text/csv'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportTasks(){let rows=[['ID','Type','Subject','Detail','Owner','Status','Created'],...state.tasks.map(t=>[t.id,t.type,t.subject,t.detail,t.owner,t.status,t.created])];download('supportiq-tasks.csv',rows.map(r=>r.map(csv).join(',')).join('\n'))}function exportEvents(){let rows=[['Date','Event','Details'],...state.events.map(e=>[e.at,e.type,e.detail])];download('supportiq-activity.csv',rows.map(r=>r.map(csv).join(',')).join('\n'))}
function settings(){return head('YOUR DATA, YOUR CONTROL','Data & settings','Import fictional CSV data, export activity, or reset the demo.')+'<div class="grid"><div class="card"><h2>Participant CSV import</h2><p class="muted">Expected columns: id, name, plan, spent, committed, days, manager, consent. This import replaces the current participant list.</p><div class="notice warning"><b>Privacy:</b> Use fictional or appropriately de-identified data only. Browser storage is not suitable for live NDIS participant information.</div><label class="field">Select a CSV file</label><input id="csvfile" type="file" accept=".csv,text/csv" class="control"><div class="actions" style="margin-top:16px">'+button('Import CSV →','importCSV()')+button('Download sample template','template()','secondary')+'</div></div><div class="card"><h2>Demo controls</h2><p class="muted">Local browser storage retains tasks, sample records and activity between visits on this device.</p><div class="actions">'+button('Export activity','exportEvents()','secondary')+button('Reset all sample data','resetDemo()','light')+'</div><div class="notice">No login, access control, encryption at rest, audit immutability or secure server database is included in this prototype.</div></div></div>'+section('Production requirements')+'<div class="grid3">'+[['Secure access','Role-based access, MFA and appropriate Australian privacy controls'],['Integrations','Provider software, authorised plan records, messaging, scheduling and claim systems'],['Compliance','Validated rules, reviewable evidence, incident reporting requirements and human approvals']].map(x=>'<div class="card"><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p></div>').join('')+'</div>'}
function template(){download('supportiq-sample-participants.csv','id,name,plan,spent,committed,days,manager,consent\nP2001,Sample Person,20000,9000,5000,90,Coordinator,true\n')}
function parseCSV(t){let rows=[],row=[],v='',quote=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quote&&t[i+1]==='"'){v+='"';i++}else quote=!quote}else if(c===','&&!quote){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quote){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
function importCSV(){let f=$('csvfile').files?.[0];if(!f){notify('Choose a CSV file');return}if(f.size>300000){notify('CSV must be under 300 KB');return}let reader=new FileReader();reader.onload=()=>{try{let rows=parseCSV(reader.result),h=rows.shift().map(x=>x.trim().toLowerCase()),need=['id','name','plan','spent','committed','days','manager','consent'];if(need.some(x=>!h.includes(x)))throw Error('Missing required columns');let p=rows.map(r=>{let x=Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()]));let item={id:x.id,name:x.name,plan:+x.plan,spent:+x.spent,committed:+x.committed,days:+x.days,manager:x.manager,consent:x.consent.toLowerCase()==='true',status:'Active',contact:''};if(!item.id||!item.name||![item.plan,item.spent,item.committed,item.days].every(Number.isFinite)||item.plan<=0||item.spent<0||item.committed<0||item.days<0)throw Error('Invalid participant data');return item});if(!p.length||p.length>500)throw Error('CSV needs 1–500 valid rows');if(new Set(p.map(x=>x.id)).size!==p.length)throw Error('Duplicate IDs');if(!confirm('Replace '+state.participants.length+' sample participant records with '+p.length+' imported records? Use fictional data only.'))return;state.participants=p;log('CSV import',p.length+' participant records');render();notify('CSV imported')}catch(e){alert('Import failed: '+e.message)}};reader.readAsText(f)}
function resetDemo(){if(!confirm('Reset all demo records and activity on this device?'))return;localStorage.removeItem('supportiq-v1');location.reload()}
render();
</script></body></html>
